      description: '<!-- planfile:deduplication-key=PLF-001 -->

        Monag had no repository-local .planfile. Running the CLI in its root resolved
        a parent store and displayed unrelated STARTER tickets, so the repository
        must be initialized explicitly before ticket operations. Adopt the current
        Wellmanifest/new-project and wellmanifest/docs revisions through their governed
        upgrade and protected-canary procedures. Acceptance: (1) all Planfile commands
        in Monag use its own store; (2) GitHub synchronization is idempotent and records
        the issue mapping; (3) adoption pins are exact immutable revisions with a
        local protected validation receipt; (4) no generated operational lock/cache
        files are committed.'
