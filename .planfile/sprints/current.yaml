      description: 'monag resume publishes per-checkout and per-fleet refactoring
        statistics: publication_state (dirty | unmerged_by_ancestry | merged_by_ancestry
        | no_remote | no_base), remote_identity, base_ref_age_seconds, lease_age_seconds/lease_stale,
        and per project fleet_metrics with checkouts, distinct_branches, duplicate_clone_checkouts,
        publication_states, stale_lease_claims, base_ref_age_seconds_max and refactoring_notes.


        Delivered by governance ticket-030, merged as semcod/monag#32 (merge ae5dac3d).


        Why the distinctions exist: a manual fleet audit on 2026-09-17 reported 142
        unpublished branches across 1534 checkouts; the real number was 8. Three traps,
        each inflating the same direction - a stale base ref (142->125 after fetch),
        parallel clones of one repository counted repeatedly (125->38), and squash/rebase
        merges keeping delivered branches off base ancestry forever (38->8, settled
        only by a pull-request lookup). Each trap has a pinning test in tests/test_fleet.py.


        Open follow-up, NOT delivered: semcod/monag has no .koru/policy.yaml nor koru.yaml
        and no workstream in .governance/manifest.json owns those paths, so the Koru
        fleet cannot cover this repository and its queue cannot pick monag work up.
        Adding that ownership plus the policy file is its own ticket.


        Do not attempt ''planfile sync github'' for this ticket: the import direction
        was reverted in semcod/monag#29 for mirroring pull requests as issues, and
        the export direction is defective as reported in semcod/planfile#126 (it reported
        ''Created: PLF-003 -> 19'' while creating no issue and mapping the ticket
        onto a pull request).'
      dsl: SODL/1 id=evt_73226656d4e6801864845f63 event_hash=fda89b9f382ef7bb4e226cc3768d1dcd06ecc70de0bfabff7a3121bd86e8b191
