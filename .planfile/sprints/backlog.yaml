    GITHUB-14:
      assignee: null
      backend: github
      description: '## Problem

        `planfile ticket list` defaults to the empty `current` sprint, while the repository
        backlog contains open GitHub-mapped records. Those legacy records lack an
        inline `id`, so the Planfile model list also drops them. Running `monag` then
        only exposes the initial scan/live view and gives no task-oriented shell for
        reviewing the backlog.


        ## Scope

        - make Monag resume and shell show all supported local Planfile sprints, including
        legacy keyed records;

        - add a small interactive shell available as `monag shell` and by default
        from a TTY;

        - keep non-TTY, JSON, Markdown, and explicit one-shot commands script-friendly;

        - show sync coverage and the exact Planfile/GitHub command needed to reconcile
        drift.


        ## Acceptance criteria

        - [ ] A clean checkout with current, backlog, and named sprint YAML reports
        open tickets with stable IDs and source sprint.

        - [ ] `monag` in a TTY presents a Markdown dashboard and accepts `help`, `refresh`,
        `resume`, `audit`, `catalog`, `status`, and `quit`/`exit`.

        - [ ] `monag shell` behaves the same; EOF/Ctrl-C exits cleanly.

        - [ ] Non-TTY `monag`, `monag --json status`, and existing subcommands remain
        one-shot.

        - [ ] Tests cover legacy keyed records and shell command dispatch.

        '
      external_id: '14'
      integration:
