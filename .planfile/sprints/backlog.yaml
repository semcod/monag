    GITHUB-22:
      assignee: null
      backend: github
      description: "## Summary\n- Adds `monag quality`: a read-only `semcod/regix`
        quality gate (`regix gates --format json`) for exactly one repository.\n-
        `regix gates` runs coverage across the whole test suite plus several static-analysis
        backends and costs roughly a minute per repository (measured ~8-78s depending
        on regix's own cache warmth). Scanning a workspace of many repositories the
        way `catalog`/`audit`/`export` do would take tens of minutes, so `monag quality`
        **refuses workspace mode outright** (`--root` must be a Git checkout) instead
        of silently taking that long.\n- Its own subcommand, not a flag on `export`/`catalog`:
        the cost/scope model is fundamentally different from `--radar`/`--hygiene`
        (both fast, deterministic, bulk-scannable).\n- Only `regix gates` is ever
        invoked — no write/fix command. Exit code `2` unavailable, `1` gates fail,
        `0` gates pass (for scripting).\n- Third Tier-2/3 integration from the `subactor/*`/`semcod/*`/`autogrammar/*`
        package survey (after `--radar` in ticket-020 and `--hygiene` in ticket-021).\n\n##
        Test plan\n- [x] `PYTHONPATH=src python3 -m unittest discover -s tests -v`
        — 110/110 pass (all mocked; no test takes the real ~minute)\n- [x] `./project/governance-check.sh
        --base origin/main --head HEAD` — GOV-PASS\n- [x] Manually verified `monag
        quality` against a real repo with the real `regix` binary (exit code 1, violations
        reported correctly) and workspace-mode refusal (exit code 2)\n\n\U0001F916
        Generated with [Claude Code](https://claude.com/claude-code)"
