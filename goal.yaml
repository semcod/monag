project:
  name: monag
  type: [python]
versioning:
  files:
    - pyproject.toml:version
    - src/monag/__init__.py:__version__
strategies:
  python:
    test: make test
    build: python -m build
    publish: python -m twine upload --non-interactive dist/monag-{version}*
    publish_enabled: true
publishing:
  enabled: true
  registries: [pypi]
  fallback:
    github_release:
      enabled: false
governance:
  delivery:
    default_mode: pull-request
    allowed_modes: [pull-request, publish-only]
    require_goal_a: true
    require_clean_governance: true
    remote: origin
    base_branch: main
