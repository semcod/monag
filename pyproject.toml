[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "monag"
version = "0.3.2"
description = "See agent processes, concurrent checkouts and recent GitHub workspace activity in your terminal"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "semcod"}, {name = "Tom Softreck",email = "tom@sapletta.com"}]
classifiers = ["Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]
dependencies = ["rich>=14,<16", "pyyaml>=6,<7"]

[project.optional-dependencies]
dev = ["build>=1,<2", "twine>=6,<7", "setuptools>=77.0.3",
    "goal>=2.1.0; python_version >= '3.12'",
    "costs>=0.1.53; python_version >= '3.9'",
    "pfix>=0.1.60; python_version >= '3.10'",
]

[project.scripts]
monag = "monag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.wellmanifest]
standard = "0.20.31"
revision = "2b016654cff1a1ccef2c0d6126a9c2550ae6b37a"
gate = "project/governance-check.sh"

[tool.pytest.ini_options]
addopts = "-p wellmanifest_governance"
pythonpath = ["src", "tests"]

[tool.costs]
# AI Cost tracking configuration
badge = true
update_readme = true
readme_path = "README.md"
default_model = "openrouter/qwen/qwen3-coder-next"
analysis_mode = "byok"
full_history = true
max_commits = 500

# Cost thresholds for badge colors (USD)
badge_color_thresholds = { low = 1.0, medium = 5.0, high = 10.0, critical = 50.0 }

[tool.pfix]
# Self-healing Python configuration
model = "openrouter/qwen/qwen3-coder-next"
auto_apply = true
auto_install_deps = true
auto_restart = false
max_retries = 3
create_backups = false
git_auto_commit = false

[tool.pfix.runtime_todo]
enabled = true
todo_file = "TODO.md"
min_severity = "low"
deduplicate = true
